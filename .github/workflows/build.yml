name: Build Flare Web

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout flare-engine
        uses: actions/checkout@v4
        with:
          repository: flareteam/flare-engine
          ref: master
          path: flare-engine
          submodules: false

      - name: Checkout flare-game
        uses: actions/checkout@v4
        with:
          repository: flareteam/flare-game
          ref: master
          path: flare-game

      - name: Show zh_TW translation status
        run: |
          echo "=== zh_TW translation files ==="
          ls -la flare-game/mods/fantasycore/languages/data.zh_TW.po || true
          ls -la flare-game/mods/empyrean_campaign/languages/data.zh_TW.po || true
          ls -la flare-engine/mods/default/languages/engine.zh_TW.po || true
          echo ""
          echo "=== mod sizes BEFORE ==="
          du -sh flare-game/mods/* 2>/dev/null || true

      - name: Optimize game data
        run: |
          cd flare-game/mods

          echo "=== 1. Remove unused mods ==="
          for m in alpha_demo devlab minicore minicore_alpha centered_statbars; do
            if [ -d "$m" ]; then
              echo "  removing $m"
              rm -rf "$m"
            fi
          done

          echo ""
          echo "=== 2. Remove non-Chinese translations ==="
          BEFORE=$(du -sm . | cut -f1)
          find . -path "*/languages/*.po" -type f ! -name "*.zh_TW.po" ! -name "*.zh.po" ! -name "*.pot" -delete
          AFTER=$(du -sm . | cut -f1)
          echo "  languages: ${BEFORE}MB -> ${AFTER}MB"

          echo ""
          echo "=== 3. Remove heavy unused fonts ==="
          for f in NotoSerifKR-Regular.ttf NotoSerifDevanagari-Regular.ttf NotoSerifThai-Regular.ttf; do
            if find . -name "$f" -type f | grep -q .; then
              echo "  removing $f"
              find . -name "$f" -type f -delete
            fi
          done
          echo "  remaining fonts:"
          find . -path "*/fonts/*" -name "*.ttf" -exec ls -la {} \; 2>/dev/null || true

          echo ""
          echo "=== mod sizes AFTER ==="
          du -sh ./* 2>/dev/null || true
          echo ""
          echo "TOTAL: $(du -sm . | cut -f1) MB"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build web version
        working-directory: flare-engine
        run: |
          chmod +x distribution/emscripten/make_emscripten.sh
          bash distribution/emscripten/make_emscripten.sh ../flare-game
        timeout-minutes: 60

      - name: Inspect build output
        run: |
          cd flare-engine/emscripten
          echo "=== build artifacts ==="
          ls -lah
          echo ""
          echo "=== size breakdown ==="
          du -sh index.* 2>/dev/null
          echo ""
          echo "=== TOTAL BUILD SIZE ==="
          du -sh . | cut -f1

      - name: Add deployment notes
        run: |
          cd flare-engine/emscripten
          cat > README.txt << "EOF"
          Flare: Empyrean Campaign - Traditional Chinese Web Version
          ==========================================================

          HOW TO DEPLOY
            Copy all files in this directory to your web server directory.

          REQUIRED APACHE CONFIG
            AddType application/wasm .wasm
            AddType application/octet-stream .data

          IN-GAME LANGUAGE
            After starting the game, go to Options -> Interface -> Language
            and select zh_TW for Traditional Chinese.

          LICENSES
            Flare Engine           - GPLv3
            Empyrean Campaign data - CC-BY-SA 3.0
            Traditional Chinese    - CC-BY-SA 3.0 (derived from upstream)

          SOURCE
            Engine: https://github.com/flareteam/flare-engine
            Game:   https://github.com/flareteam/flare-game
          EOF
          echo "README.txt created"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flare-web-zh-tw
          path: flare-engine/emscripten/
          retention-days: 30
          if-no-files-found: error
