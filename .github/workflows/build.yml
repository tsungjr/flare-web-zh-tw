name: Build Flare Web

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout flare-engine
        uses: actions/checkout@v4
        with:
          repository: flareteam/flare-engine
          ref: master
          path: flare-engine
          submodules: false

      - name: Checkout flare-game
        uses: actions/checkout@v4
        with:
          repository: flareteam/flare-game
          ref: master
          path: flare-game

      - name: Show zh_TW translation status
        run: |
          echo "=== zh_TW translation files ==="
          ls -la flare-game/mods/fantasycore/languages/data.zh_TW.po || true
          ls -la flare-game/mods/empyrean_campaign/languages/data.zh_TW.po || true
          ls -la flare-engine/mods/default/languages/engine.zh_TW.po || true

      - name: Optimize game data
        run: |
          cd flare-game/mods

          echo "=== 1. Remove unused mods ==="
          for m in alpha_demo devlab minicore minicore_alpha centered_statbars; do
            [ -d "$m" ] && rm -rf "$m" && echo "  removed $m"
          done

          echo "=== 2. Remove non-Chinese translations ==="
          find . -path "*/languages/*.po" -type f ! -name "*.zh_TW.po" ! -name "*.zh.po" ! -name "*.pot" -delete

          echo "=== 3. Remove heavy unused fonts ==="
          for f in NotoSerifKR-Regular.ttf NotoSerifDevanagari-Regular.ttf NotoSerifThai-Regular.ttf; do
            find . -name "$f" -type f -delete 2>/dev/null || true
          done

          echo ""
          echo "TOTAL: $(du -sm . | cut -f1) MB"

      - name: Patch engine default language to zh_TW
        run: |
          cd flare-engine
          echo "=== BEFORE ==="
          grep -n 'setConfigDefault(17' src/Settings.cpp || true

          echo ""
          echo "=== 用 Python 精確修改 language 預設值 ==="
          python3 - << "PYEOF"
          import re
          p = "src/Settings.cpp"
          s = open(p, encoding="utf-8").read()

          # 行 89 格式：
          # setConfigDefault(17, "language",  &typeid(language),  "en",  &language,  "...");
          before = s
          s = re.sub(
              r'(setConfigDefault\(17,\s*"language",\s*&typeid\(language\),\s*)"en"',
              r'\1"zh_TW"',
              s
          )
          if s == before:
              print("  FAIL: language 未修改")
              raise SystemExit(1)
          print("  OK: language -> zh_TW")

          # setup_language 保持 "0"：首次啟動顯示語言選擇對話框
          # GameStateTitle.cpp 行 154：!setup_language 時顯示 MenuConfirm
          # 對話框會自動預選 settings->language（zh_TW），玩家按確定即可
          before2 = s
          s = re.sub(
              r'(setConfigDefault\(53,\s*"setup_language",\s*&typeid\(setup_language\),\s*)"1"',
              r'\1"0"',
              s
          )
          if s != before2:
              print("  OK: setup_language -> 0 (show language dialog)")
          else:
              print("  OK: setup_language already 0")

          open(p, "w", encoding="utf-8").write(s)
          PYEOF

          echo ""
          echo "=== AFTER ==="
          grep -n 'setConfigDefault(17' src/Settings.cpp || true
          grep -n 'setConfigDefault(53' src/Settings.cpp || true

          echo ""
          echo "=== 最終驗證 ==="
          if grep -q 'setConfigDefault(17, "language".*"zh_TW"' src/Settings.cpp; then
            echo "  OK: language default = zh_TW"
          else
            echo "  FAIL: language default 未修改"
            exit 1
          fi
          if grep -q 'setConfigDefault(53, "setup_language".*"0"' src/Settings.cpp; then
            echo "  OK: setup_language = 0（首次進入顯示語言選單）"
          else
            echo "  FAIL: setup_language 未設為 0"
            exit 1
          fi

      - name: Install Traditional Chinese font and fix font_settings
        run: |
          cd flare-game/mods/fantasycore

          echo "=== 1. 下載 Noto Serif TC（繁體字型）==="
          mkdir -p fonts
          for w in 400 700; do
            CSS=$(curl -s -H "User-Agent: Mozilla/5.0" \
              "https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@${w}")
            URL=$(echo "$CSS" | grep -oP 'url\(\Khttps://[^)]+\.ttf')
            if [ -n "$URL" ]; then
              if [ "$w" = "400" ]; then
                curl -sL "$URL" -o fonts/NotoSerifTC-Regular.ttf
                echo "  OK: NotoSerifTC-Regular.ttf ($(du -h fonts/NotoSerifTC-Regular.ttf | cut -f1))"
              else
                curl -sL "$URL" -o fonts/NotoSerifTC-Bold.ttf
                echo "  OK: NotoSerifTC-Bold.ttf ($(du -h fonts/NotoSerifTC-Bold.ttf | cut -f1))"
              fi
            else
              echo "  FAIL: 無法取得 weight $w 的 TTF"
              exit 1
            fi
          done

          echo ""
          echo "=== 2. 修改 font_settings.txt：zh_TW 改用 TC ==="
          python3 - << "PYEOF"
          p = "engine/font_settings.txt"
          s = open(p, encoding="utf-8").read()
          for weight in ["Regular", "Bold"]:
              s = s.replace(
                  "style=zh_TW,NotoSerifSC-%s.ttf" % weight,
                  "style=zh_TW,NotoSerifTC-%s.ttf" % weight
              )
          open(p, "w", encoding="utf-8").write(s)
          print("  zh_TW -> NotoSerifTC")
          PYEOF

          echo ""
          echo "=== 3. 驗證 ==="
          grep "zh_TW" engine/font_settings.txt || true

          echo ""
          echo "=== 4. 移除不再需要的 NotoSerifSC（zh 也改指向 TC）==="
          # zh（簡中）也改成 TC，這樣可以刪掉 14MB 的 SC
          python3 - << "PYEOF"
          p = "engine/font_settings.txt"
          s = open(p, encoding="utf-8").read()
          for weight in ["Regular", "Bold"]:
              s = s.replace(
                  "style=zh,NotoSerifSC-%s.ttf" % weight,
                  "style=zh,NotoSerifTC-%s.ttf" % weight
              )
          open(p, "w", encoding="utf-8").write(s)
          print("  zh -> NotoSerifTC")
          PYEOF

          rm -f fonts/NotoSerifSC-Regular.ttf fonts/NotoSerifSC-Bold.ttf
          echo "  已移除 NotoSerifSC"

          echo ""
          echo "=== 5. 最終字型清單 ==="
          ls -lah fonts/

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build web version
        working-directory: flare-engine
        run: |
          chmod +x distribution/emscripten/make_emscripten.sh
          bash distribution/emscripten/make_emscripten.sh ../flare-game
        timeout-minutes: 60

      - name: Inspect build output
        run: |
          cd flare-engine/emscripten
          ls -lah
          echo "=== size ==="
          du -sh index.*

      - name: Localize loading screen
        run: |
          cd flare-engine/emscripten
          python3 - << "PYEOF"
          import re
          p = "index.html"
          s = open(p, encoding="utf-8").read()
          s = s.replace("<html>", '<html lang="zh-Hant">', 1)
          if "<title>" not in s:
              s = s.replace("<head>", '<head>\n    <title>星海征途 Empyrean Campaign — 繁體中文 RPG</title>', 1)
          s = s.replace(">Loading...<", ">載入中…<")
          s = s.replace('"Downloading data... "', '"載入遊戲資源… "')
          # 加入 16:9 置中排版
          s = s.replace("body {\n\t\tbackground:#000;\n\t\tcolor: #fff;\n\t}",
                        "html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;}body{display:flex;align-items:center;justify-content:center;}")
          s = s.replace("height: 100%;", "max-width:100%;max-height:100%;width:auto;height:auto;aspect-ratio:16/9;")
          open(p, "w", encoding="utf-8").write(s)
          print("index.html localized")
          PYEOF
          grep -c "載入" index.html || true

      - name: Add deployment notes
        run: |
          cd flare-engine/emscripten
          cat > README.txt <<- "EOF"
          Flare: Empyrean Campaign - Traditional Chinese Web Version
          ==========================================================
          Default language: zh_TW (Traditional Chinese)

          APACHE CONFIG
            AddType application/wasm .wasm
            AddType application/octet-stream .data

          LICENSES
            Flare Engine - GPLv3 | Empyrean Campaign - CC-BY-SA 3.0
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flare-web-zh-tw
          path: flare-engine/emscripten/
          retention-days: 30
          if-no-files-found: error
